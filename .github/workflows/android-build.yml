name: Android build

# Builds the release APK for sideloading and publishes it on the rolling
# android-latest prerelease:
# https://github.com/creationix/monkey-fist/releases/download/android-latest/monkey-fist.apk
# It is signed with the shared upload key from the ANDROID_UPLOAD_KEYSTORE
# (base64 of the .jks) and ANDROID_UPLOAD_PASSWORD secrets, so each build
# installs over the last one, including builds made locally with the same key.

on:
  push:
    branches: [main]
    paths:
      - flutter/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the sideload APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Flutter 3.50.0
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Resolve packages
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
      - name: Write the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The ANDROID_UPLOAD_KEYSTORE secret is missing; a debug-signed APK would not update installed copies."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=%s\n' \
            "$PASSWORD" "$PASSWORD" "$RUNNER_TEMP/upload.jks" > android/key.properties
      - name: Build the release APK
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk build/monkey-fist.apk
      - name: Publish on the android-latest prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from $GITHUB_SHA (run $GITHUB_RUN_NUMBER). Open this page on an Android device, download monkey-fist.apk, and allow your browser to install apps when asked."
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest build/monkey-fist.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest build/monkey-fist.apk --prerelease \
              --title "Android (latest build)" --notes "$notes"
          fi
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: monkey-fist-android-${{ github.run_number }}
          path: flutter/build/monkey-fist.apk
          retention-days: 30
