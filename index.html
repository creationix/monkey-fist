<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monkey Fist</title>
<meta name="description" content="Tap the ropes in the right order to untangle the knot.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1f2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monkey Fist">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root { --bg1:#12384a; --bg2:#081822; --panel:#143646; --panel2:#1d4a5e; --text:#f2fbff; --muted:#9cc3d1; --accent:#ff9a2e; --bad:#ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The page colour is on <html> too, so any strip the layout doesn't reach is never white. */
  html { height: 100%; min-height: calc(100% + env(safe-area-inset-top, 0px)); margin: 0; background: #081822; overflow: hidden; }
  body { margin: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 80%);
    color: var(--text); font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; overscroll-behavior: none;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  /* Installed on iPad/iPhone the "100%" box stops short of the home-indicator area; the real screen height does not. */
  @supports (height: 100dvh) { body { height: 100dvh; } }
  @media (display-mode: standalone) { body { height: 100vh; } }
  #game { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); }
  #hud { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; }
  #hud .mid { flex: 1; min-width: 0; text-align: center; }
  #lvName { font-weight: 800; font-size: 18px; line-height: 1.1; }
  #left { color: var(--muted); font-size: 13px; }
  #tangle { color: var(--accent); font-weight: 800; font-size: 14px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  #hearts { display: flex; gap: 3px; justify-content: flex-end; flex: none; color: var(--bad); }
  #hearts svg { width: 22px; height: 22px; display: block; fill: currentColor; }
  #hearts svg.off { color: #2c5567; }
  #hearts.hit { animation: hit .4s; }
  @keyframes hit { 20% { transform: scale(1.35) rotate(-6deg); } 50% { transform: scale(.9) rotate(4deg); } }
  .iconBtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; background: var(--panel2); color: var(--text); padding: 0; cursor: pointer; display: grid; place-items: center; }
  .iconBtn svg { width: 24px; height: 24px; display: block; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #hintBtn { color: var(--accent); }
  .lvBtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .iconBtn:active { transform: scale(.94); }
  #tip { min-height: 18px; font-size: 14px; color: var(--muted); text-align: center; max-width: 560px; }
  #boardWrap { flex: 1; width: 100%; min-height: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #toast { position: absolute; top: 45%; left: 50%; transform: translate(-50%,-50%); font-size: 40px; font-weight: 900; color: var(--accent); line-height: 1;
    text-shadow: 0 3px 0 #6b4e00, 0 0 24px rgba(255,154,46,.7); pointer-events: none; opacity: 0; white-space: nowrap; }
  #toast.show { animation: toast .9s ease-out; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-110%) scale(1); } }
  @media (orientation: landscape) and (max-height: 540px) {
    #game { flex-direction: row; align-items: stretch; }
    #hud { width: 150px; flex: none; flex-direction: column; justify-content: center; }
    #hearts { justify-content: center; }
    #tip { display: none; }
  }

  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; overflow-y: auto;
    padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 80%); }
  .screen.dim { background: rgba(4,14,20,.8); backdrop-filter: blur(3px); }
  .screen.show { display: flex; }
  .card { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 12px; margin: auto; }
  .dim .card { background: var(--panel); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  h1 { font-size: 44px; line-height: 1; margin: 0 0 4px; font-weight: 900; letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  #logo { margin: 0 auto; width: 190px; height: 190px; }
  #logo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
  button.big { border: 0; border-radius: 14px; padding: 14px 18px; font-size: 18px; font-weight: 800; cursor: pointer; color: #2a1c00;
    background: linear-gradient(180deg, #ffc46b, #ff9a2e); box-shadow: 0 4px 0 #a3540a; }
  button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #a3540a; }
  button.big.alt { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 #0a2633; }
  button.big.alt:active { box-shadow: 0 1px 0 #0a2633; }
  #lvGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0; max-height: 52vh; overflow-y: auto; touch-action: pan-y; padding: 2px 2px 6px; }
  .lvBtn { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--panel2); color: var(--text); cursor: pointer; font-weight: 900; font-size: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 0 #0a2633; }
  .lvBtn small { font-size: 10px; color: var(--accent); letter-spacing: 1px; height: 12px; }
  .lvBtn:disabled { opacity: .35; cursor: default; }
  .row { display: flex; align-items: center; justify-content: space-between; background: var(--panel2); padding: 12px 16px; border-radius: 14px; font-weight: 700; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row span { text-align: left; }
  .row small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  @media (max-height: 700px) { #logo { width: 120px; height: 120px; } }
  .toggle { flex: none; width: 56px; height: 30px; border-radius: 15px; border: 0; background: #3b6577; position: relative; cursor: pointer; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle.on { background: #51cf66; }
  .toggle.on::after { left: 29px; }
  #stars { font-size: 46px; letter-spacing: 6px; color: #2c5567; }
  #stars .on { color: var(--accent); text-shadow: 0 0 16px rgba(255,154,46,.7); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { border: 0; border-radius: 12px; padding: 13px 0; background: var(--panel2); color: var(--text); font-weight: 800; font-size: 15px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #2a1c00; }
  #segMode { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #segMode button { font-size: 13px; }
  .toggle:disabled { opacity: .35; cursor: default; }
  .seedRow { gap: 10px; padding: 8px 8px 8px 16px; }
  #seedIn { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 10px; padding: 0 12px; background: #0c2531; color: var(--text); text-align: center;
    font: 800 18px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
  #seedIn:focus { outline: 2px solid var(--accent); }
  .code { border: 0; border-radius: 8px; padding: 3px 10px; background: var(--panel2); color: var(--accent); font: 800 16px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; cursor: pointer; }
  #recent { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #recent:empty { display: none; }
  #recentLbl { margin: 0; font-size: 13px; }
  .chip { border: 0; border-radius: 999px; padding: 8px 12px; background: var(--panel2); color: var(--text); font: 700 13px/1 ui-monospace, Menlo, Consolas, monospace; cursor: pointer; }
  #setNote:empty { display: none; }
  #scrCustom { touch-action: pan-y; }
  #ver { position: absolute; left: 0; right: 0; bottom: calc(6px + var(--sab)); text-align: center; font-size: 11px; color: var(--muted); opacity: .6; pointer-events: none; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div id="game">
  <div id="hud">
    <button class="iconBtn" id="menuBtn" title="Levels" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="iconBtn" id="restartBtn" title="Restart level" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
    <div class="mid"><div id="lvName">Level 1</div><div id="left"></div><div id="tangle"></div></div>
    <button class="iconBtn" id="hintBtn" title="Hint" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
    <div id="hearts"></div>
  </div>
  <div id="tip"></div>
  <div id="boardWrap"><canvas id="board"></canvas><div id="toast"></div></div>
</div>

<div class="screen show" id="scrMenu"><div id="ver">build 2026-11-10 j</div><div class="card">
  <div id="logo"></div>
  <h1>Monkey Fist</h1>
  <p class="sub">Untangle the knot. Tap a rope to pull it free.</p>
  <button class="big" id="playBtn">Play</button>
  <div class="row2"><button class="big alt" id="levelsBtn">Levels</button><button class="big alt" id="customBtn">Custom</button></div>
  <div class="row2">
    <div class="row">Sound <button class="toggle" id="tSound" aria-label="Sound effects"></button></div>
    <div class="row">Music <button class="toggle" id="tMusic" aria-label="Music"></button></div>
  </div>
  <div class="row"><span>Kid mode<small>Bumps never cost a heart</small></span> <button class="toggle" id="tKid" aria-label="Kid mode"></button></div>
</div></div>

<div class="screen" id="scrLevels"><div class="card">
  <h2 id="lvTitle">Levels</h2>
  <p class="sub" id="setNote"></p>
  <div id="lvGrid"></div>
  <button class="big alt" id="backBtn">Back</button>
  <button class="link" id="resetBtn">Hold to reset progress</button>
</div></div>

<div class="screen" id="scrCustom"><div class="card">
  <h2>Custom levels</h2>
  <div class="seg" id="segMode"><button data-v="E">Easy</button><button data-v="N">Normal</button><button data-v="H">Hard</button><button data-v="X">Extreme</button></div>
  <div class="seg" id="segCount"><button data-v="10">10 levels</button><button data-v="20">20 levels</button><button data-v="30">30 levels</button></div>
  <div class="row"><span>Bigger boards<small>Up to 16×22, best on a tablet</small></span> <button class="toggle" id="tBig" aria-label="Bigger boards"></button></div>
  <div class="row seedRow"><span>Seed</span><input id="seedIn" type="text" maxlength="14" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Seed">
    <button class="iconBtn" id="diceBtn" title="New random seed" aria-label="New random seed"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg></button></div>
  <p class="sub">Share code <button class="code" id="codeOut" title="Copy"></button><br><small id="rangeNote"></small></p>
  <button class="big" id="genBtn">Play these levels</button>
  <div id="recentLbl" class="sub">Recent</div>
  <div id="recent"></div>
  <button class="big alt" id="customBack">Back</button>
</div></div>

<div class="screen dim" id="scrResult"><div class="card">
  <h2 id="resTitle">Untangled!</h2>
  <div id="stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
  <p class="sub" id="resText"></p>
  <button class="big" id="nextBtn">Next Level</button>
  <button class="big alt" id="retryBtn">Play Again</button>
  <button class="big alt" id="resMenuBtn">Levels</button>
</div></div>

<script src="levels.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const PALETTE = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9', '#4dabf7', '#9775fa', '#f783ac', '#f1e3b5'];
const MAX_HEARTS = 3;

// ---------- persistence ----------
let save = { sound: true, music: true, kid: false, gen: 0, sets: null, recent: [], custom: null };
try { Object.assign(save, JSON.parse(localStorage.getItem('monkey-fist') || '{}')); } catch (e) {}
// Progress is kept per level set: the built-in "campaign" set and the most recent custom sets.
const GEN = 5; // bump whenever the level generator changes: every set's levels change with it
if (save.gen !== GEN) { // keep how far the player got in the built-in levels; stars and custom sets no longer match
  const far = Math.max(1, Math.min(((save.sets && save.sets.campaign) || save).max | 0, MFLevels.CAMPAIGN.count));
  save.sets = { campaign: { stars: {}, max: far } }; save.recent = []; save.gen = GEN;
}
delete save.stars; delete save.max;
if (!Array.isArray(save.recent)) save.recent = [];
if (!save.custom || !MFLevels.PLAYER_MODES.includes(save.custom.mode) || !MFLevels.COUNTS.includes(save.custom.count)) save.custom = { mode: 'N', count: 20, big: false, seed: MFLevels.randomSeed() };
delete save.custom.twisty; save.custom.big = !!save.custom.big;
save.custom.seed = MFLevels.cleanSeed(save.custom.seed) || MFLevels.randomSeed();
function persist() { try { localStorage.setItem('monkey-fist', JSON.stringify(save)); } catch (e) {} }

// ---------- audio (synthesised) ----------
let AC = null, out = null, sfxBus = null, musicBus = null, unlocked = false;
function initAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    // On iPhone, ask for the "playback" audio session so the ring/silent switch doesn't mute the game.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    AC = new C();
    // Everything goes through a limiter so loud moments never clip.
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
    out = AC.createGain(); out.gain.value = 1; out.connect(comp); comp.connect(AC.destination);
    sfxBus = AC.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(out);
    musicBus = AC.createGain(); musicBus.gain.value = save.music ? 0.55 : 0; musicBus.connect(out);
    setInterval(musicTick, 80);
  }
  if (AC.state !== 'running') AC.resume().catch(() => {});
  if (!unlocked) {
    // A silent blip inside the tap handler is what actually unlocks audio on some phones.
    unlocked = true;
    try { const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0); } catch (e) {}
  }
}
function tone(f, d, type, vol, when, to, dest) {
  if (!AC || !(f > 0) || !(d > 0) || (!dest && voices >= MAX_VOICES)) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + d + 0.03);
  voices++; o.onended = () => { voices--; };
}
// Sound-effect voices currently playing. Frantic tapping could otherwise start hundreds at once,
// which is enough to make a tablet's audio stutter or the page run out of memory.
let voices = 0;
const MAX_VOICES = 40;
function noise(d, vol, f0, f1, when, dest) {
  if (!AC || !(d > 0) || !(f0 > 0) || !(f1 > 0) || (!dest && voices >= MAX_VOICES)) return;
  const t = AC.currentTime + (when || 0);
  const len = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  s.buffer = buf; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(dest || sfxBus); s.start(t);
}
// A plucked, marimba-like note: a round body plus a short bright knock.
function pluck(f, vol, when, dur, dest) {
  tone(f, dur || 0.5, 'sine', vol, when, null, dest);
  tone(f * 4, 0.09, 'sine', vol * 0.35, when, null, dest);
  tone(f * 2, (dur || 0.5) * 0.5, 'triangle', vol * 0.25, when, null, dest);
}
const on = () => save.sound && AC;
const sfx = {
  click() { if (on()) tone(520, 0.06, 'sine', 0.22, 0, 700); },
  // rope being pulled: a soft airy whoosh
  slide() { if (on()) { noise(0.3, 0.3, 500, 2400); tone(260, 0.2, 'sine', 0.1, 0, 520); } },
  // rope clears the board: a soft pluck that plays along with the music. The note comes from
  // whichever chord is sounding, and a streak wanders up and down that chord instead of
  // climbing to one top note and sticking there.
  pop(streak) {
    if (!on()) return;
    streak = Math.max(1, streak | 0); // a bump can reset the streak to 0 while a rope is still on its way out
    const bar = save.music ? Math.max(0, stepNo - 1) >> 3 : Math.floor(AC.currentTime / (STEP * 8));
    const ch = CHORDS[bar % 4];
    const s = (streak - 1) % 10, idx = s < 6 ? s : 10 - s;
    const lift = Math.floor((streak - 1) / 10) % 2 ? 0.5 : 1; // every other run of ten drops an octave for contrast
    const f = ch.mel[idx] * lift;
    pluck(f, 0.3 + Math.random() * 0.06, 0, 0.45);
    if (streak % 3 === 0) pluck(ch.mel[(idx + 2) % 6] * lift, 0.16, 0.09, 0.4); // a little answering note
    if (streak % 10 === 0) [0, 2, 4, 5].forEach((k, i) => pluck(ch.mel[k] * 2, 0.14, 0.05 + i * 0.06, 0.5)); // sparkle on every tenth
  },
  bump() { if (on()) { tone(140, 0.28, 'sine', 0.6, 0, 55); noise(0.16, 0.35, 300, 90); tone(110, 0.2, 'triangle', 0.2, 0.01, 70); } },
  hint() { if (on()) { pluck(880, 0.35, 0, 0.25); pluck(1318.5, 0.35, 0.09, 0.4); } },
  win() { if (on()) [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => { pluck(f, 0.45, i * 0.1, 0.6); tone(f / 2, 0.4, 'triangle', 0.2, i * 0.1); }); },
  lose() { if (on()) [392, 349.23, 311.13, 261.63].forEach((f, i) => { tone(f, 0.45, 'triangle', 0.4, i * 0.22); tone(f / 2, 0.45, 'sine', 0.3, i * 0.22); }); },
};
// Each effect has a minimum gap between plays, and a failing sound can never break the game.
{
  const GAP = { click: 50, slide: 45, pop: 45, bump: 110, hint: 250, win: 1500, lose: 1500 }, lastAt = {};
  for (const k of Object.keys(sfx)) {
    const play = sfx[k];
    sfx[k] = (...args) => {
      const now = performance.now();
      if (now - (lastAt[k] || -1e9) < GAP[k]) return;
      lastAt[k] = now;
      try { play(...args); } catch (e) { console.error(e); }
    };
  }
}

// ---------- music: a gentle generated loop, scheduled a little ahead of the audio clock ----------
const STEP = 0.3; // seconds per eighth note
const CHORDS = [ // root, then the notes the melody may use (Hz)
  { bass: 65.41, pad: [261.63, 329.63, 392.0, 493.88], mel: [523.25, 587.33, 659.25, 783.99, 987.77, 1046.5] }, // Cmaj7
  { bass: 55.0, pad: [220.0, 261.63, 329.63, 392.0], mel: [440.0, 523.25, 659.25, 783.99, 880.0, 1046.5] },   // Am7
  { bass: 87.31, pad: [174.61, 261.63, 329.63, 440.0], mel: [523.25, 587.33, 698.46, 880.0, 1046.5, 1174.7] }, // Fmaj7
  { bass: 98.0, pad: [196.0, 246.94, 293.66, 392.0], mel: [493.88, 587.33, 659.25, 783.99, 987.77, 1174.7] },  // G6
];

// Resetting needs a deliberate three-second hold, so stray taps can't wipe progress and no system dialog pops up.
{
  const btn = $('resetBtn'), LABEL = 'Hold to reset progress';
  let timer = 0, tick = 0;
  const cancel = () => { clearTimeout(timer); clearInterval(tick); timer = 0; if (btn.textContent !== 'Progress reset') btn.textContent = LABEL; };
  btn.addEventListener('pointerdown', () => {
    cancel(); let left = 3; btn.textContent = 'Keep holding… ' + left;
    tick = setInterval(() => { left--; if (left > 0) btn.textContent = 'Keep holding… ' + left; }, 1000);
    timer = setTimeout(() => {
      clearInterval(tick); timer = 0;
      save.sets[SET.id] = { stars: {}, max: 1 }; persist(); buildLevels();
      btn.textContent = 'Progress reset'; setTimeout(() => { btn.textContent = LABEL; }, 1500);
    }, 3000);
  });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => { if (timer) cancel(); });
}
// Block the browser gestures a small child triggers by accident: pinch and double-tap zoom, long-press menus, page drags.

// Logo: an orange monkey's fist knot, three visible faces with three rope strands each.
function monkeyFistSVG() {
  const P = [256, 226], a = 132, u = [a * 0.866, -a * 0.5], v = [-a * 0.866, -a * 0.5], w = [0, a];
  const at = (L, s, C, t) => [P[0] + L[0] * s + C[0] * t, P[1] + L[1] * s + C[1] * t];
  const f = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
  const line = '#5c2600';
  let o = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">';
  // the tail of the rope hanging out of the knot
  const tail = 'M256 340 C 256 420, 300 438, 344 474';
  o += '<path d="' + tail + '" fill="none" stroke="' + line + '" stroke-width="50" stroke-linecap="round"/>';
  o += '<path d="' + tail + '" fill="none" stroke="#e8801a" stroke-width="36" stroke-linecap="round"/>';
  o += '<path d="' + tail + '" fill="none" stroke="#b85a08" stroke-width="30" stroke-dasharray="6 14"/>';
  // each face: three strands running along L, laid side by side across C
  const face = (L, C, fill, twist) => {
    for (let i = 0; i < 3; i++) {
      const t0 = i / 3 + 0.012, t1 = (i + 1) / 3 - 0.012, m = (t0 + t1) / 2;
      const a0 = at(L, 0, C, t0), a1 = at(L, 0, C, t1), b0 = at(L, 1, C, t0), b1 = at(L, 1, C, t1), bulge = at(L, 1.09, C, m);
      o += '<path d="M' + f(a0) + ' L' + f(b0) + ' Q' + f(bulge) + ' ' + f(b1) + ' L' + f(a1) + 'Z" fill="' + fill + '" stroke="' + line + '" stroke-width="8" stroke-linejoin="round"/>';
      for (let k = 1; k <= 5; k++) {
        const s = k / 6;
        o += '<path d="M' + f(at(L, s - 0.06, C, t0 + 0.075)) + ' L' + f(at(L, s + 0.06, C, t1 - 0.075)) + '" stroke="' + twist + '" stroke-width="6" stroke-linecap="round"/>';
      }
    }
  };
  face(u, v, '#ffab45', '#e58212'); // top
  face(w, u, '#ee841a', '#c2620a'); // right
  face(v, w, '#ff9728', '#d8720e'); // left
  return o + '</svg>';
}
$('logo').innerHTML = monkeyFistSVG();
// Renders the app icon at a given size (used once to produce the PNG icon files).
function iconPNG(size) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, size);
      g.addColorStop(0, '#1a4a60'); g.addColorStop(1, '#081822');
      x.fillStyle = g; x.fillRect(0, 0, size, size);
      const s = size * 0.8; x.drawImage(img, (size - s) / 2, (size - s) / 2 - size * 0.02, s, s);
      c.toBlob(res, 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(monkeyFistSVG());
  });
}
