<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2029">
<meta name="description" content="One hundred and twenty tangles. Slide colorful ropes through square and hexagonal puzzles, or weave a set of your own.">
<title>Monkey Fist</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main id="game">
  <aside class="hud">
    <div class="brand"><span class="mark" id="gridMark" aria-hidden="true">◇</span><span>MONKEY FIST<small id="gridType">SQUARE</small></span></div>
    <div class="readout"><div class="eyebrow" id="chapter">YOUR JOURNEY</div><h1 id="levelName">Level 1 <span>/ 120</span></h1><p id="remaining"></p><p id="score"></p></div>
    <nav class="actions" aria-label="Game controls">
      <button id="levels" title="Levels and settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><small>Levels</small></button>
      <button id="restart" title="Restart this level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg><small>Restart</small></button>
      <button id="hint" title="Hint costs two taps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h6M9 17c0-3-4-4-4-8a7 7 0 0 1 14 0c0 4-4 5-4 8Z"/></svg><small>Hint +2</small></button>
      <button id="undo" title="Undo costs one tap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-6 6 6 6M3 10h11a6 6 0 0 1 0 12"/></svg><small>Undo <b id="undos">3</b></small></button>
    </nav>
    <p id="tip">Tap a rope. Follow its arrow.</p>
  </aside>
  <div id="boardWrap">
    <canvas id="board" tabindex="0" aria-label="Rope puzzle. Tap a rope to slide it. Drag to explore; pinch or scroll to zoom. Arrow keys select ropes; Enter slides the selected rope."></canvas>
    <div id="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span>Weaving your tangle…</div>
    <nav id="zoomControls" aria-label="Board view" hidden><span>Drag to explore · pinch to zoom</span><div><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomFit" title="Fit and center the board">Fit</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="fullscreen" title="Enter fullscreen" aria-label="Fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></nav>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
</main>
<dialog id="chooser">
  <div class="dialog-head"><div><div class="eyebrow">MONKEY FIST</div><h2>Your next tangle</h2></div><button class="close" id="closeLevels" aria-label="Close level chooser">×</button></div>
  <div class="set-tabs" aria-label="Level set"><button id="journey" aria-pressed="true">Journey <span>120 levels</span></button><button id="custom" aria-pressed="false">Custom <span>Make it yours</span></button></div>
  <div id="audioControls" aria-label="Sound and display settings"><button id="sound" class="quiet" aria-label="Sound effects: Low" aria-pressed="true">Sound: Low</button><button id="music" class="quiet" aria-pressed="false">♫ Music off</button><button id="oled" class="quiet" aria-pressed="false" title="Use black backgrounds and dimmer panels">Dark mode: off</button></div>
  <div id="customSettings" class="settings" hidden>
    <label class="seed-setting">Seed or set code<div class="seed-row"><input id="seed" maxlength="48" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="dice" title="Random seed" aria-label="Random seed">⚄</button><button id="defaultSeed" title="Restore default seed" aria-label="Restore default seed">↺</button></div></label>
    <label>Grid<select id="gridChoice"><option value="mixed">Square + hex</option><option value="square">Square only</option><option value="hex">Hex only</option></select></label>
    <label>Levels<input id="count" type="number" min="1" max="500" value="120" inputmode="numeric"></label>
    <fieldset class="difficulty"><legend>Difficulty · 1 to 100</legend><label>From<input id="minDifficulty" type="number" min="1" max="100" value="1" inputmode="numeric"></label><span>→</span><label>To<input id="maxDifficulty" type="number" min="1" max="100" value="100" inputmode="numeric"></label></fieldset>
    <div class="feature-options"><label class="check"><input id="mirrors" type="checkbox"> Mirrors</label><label class="check"><input id="springs" type="checkbox"> Springs</label></div>
  </div>
  <div class="set-line"><span id="setSummary">120 tangles · square + hex</span><button id="share" class="quiet">Copy set link</button></div>
  <p id="unlockRule" class="rules"></p>
  <div id="grid" aria-label="Levels"></div>
  <footer class="menu-footer"><p>Tap to slide. Mirrors turn. Springs reverse.</p></footer>
</dialog>
<dialog id="result">
  <div class="eyebrow">KNOT CLEARED</div><h2>Untangled!</h2><div id="stars" aria-label="Stars earned"></div><p id="resultText"></p><p id="unlocked"></p>
  <button id="next" class="primary">Next level →</button><button id="again">Play again</button><button id="resultLevels" class="quiet">Choose a level</button>
</dialog>
<script src="random.js?v=1"></script>
<script src="levels.js?v=31"></script>
<script src="mechanics.js?v=30"></script>
<script src="twist-circuits.js?v=31"></script>
<script src="twists.js?v=32"></script>
<script src="hex/engine.js?v=5"></script>
<script src="hex/mirrors.js?v=1"></script>
<script src="game-engine.js?v=2"></script>
<script src="rope-art.js?v=2"></script>
<script src="music.js?v=32"></script>
<script src="sounds.js?v=3"></script>
<script src="audio.js?v=2"></script>
<script src="input.js?v=2"></script>
<script src="app.js?v=8"></script>
</body>
</html>
