<!doctype html>

<style>

  .dim .card { background: var(--panel); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

  h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 8px; }

<div id="game">

<div class="screen show" id="scrMenu"><div id="ver">build 2026-11-10 e</div><div class="card">

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

const MAX_HEARTS = 3;

// ---------- persistence ----------
let save = { stars: {}, max: 1, sound: true, music: true, kid: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('monkey-fist') || '{}')); } catch (e) {}

    musicBus = AC.createGain(); musicBus.gain.value = save.music ? 0.55 : 0; musicBus.connect(out);
    setInterval(musicTick, 80);

  if (AC.state !== 'running') AC.resume().catch(() => {});

    // A silent blip inside the tap handler is what actually unlocks audio on some phones.
    unlocked = true;
    try { const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0); } catch (e) {}

}
function tone(f, d, type, vol, when, to, dest) {

// Sound-effect voices currently playing. Frantic tapping could otherwise start hundreds at once,

let voices = 0;
const MAX_VOICES = 40;
function noise(d, vol, f0, f1, when, dest) {

// A plucked, marimba-like note: a round body plus a short bright knock.
function pluck(f, vol, when, dur, dest) {

const on = () => save.sound && AC;
const sfx = {
  click() { if (on()) tone(520, 0.06, 'sine', 0.22, 0, 700); },
  // rope being pulled: a soft airy whoosh
  slide() { if (on()) { noise(0.3, 0.3, 500, 2400); tone(260, 0.2, 'sine', 0.1, 0, 520); } },
  // rope clears the board: a soft pluck that plays along with the music. The note comes from
  // whichever chord is sounding, and a streak wanders up and down that chord instead of
  // climbing to one top note and sticking there.
  pop(streak) {
    if (!on()) return;
    streak = Math.max(1, streak | 0); // a bump can reset the streak to 0 while a rope is still on its way out
    const bar = save.music ? Math.max(0, stepNo - 1) >> 3 : Math.floor(AC.currentTime / (STEP * 8));
    const ch = CHORDS[bar % 4];
    const s = (streak - 1) % 10, idx = s < 6 ? s : 10 - s;
    const lift = Math.floor((streak - 1) / 10) % 2 ? 0.5 : 1; // every other run of ten drops an octave for contrast
    const f = ch.mel[idx] * lift;

    if (streak % 3 === 0) pluck(ch.mel[(idx + 2) % 6] * lift, 0.16, 0.09, 0.4); // a little answering note
    if (streak % 10 === 0) [0, 2, 4, 5].forEach((k, i) => pluck(ch.mel[k] * 2, 0.14, 0.05 + i * 0.06, 0.5)); // sparkle on every tenth
  },
  bump() { if (on()) { tone(140, 0.28, 'sine', 0.6, 0, 55); noise(0.16, 0.35, 300, 90); tone(110, 0.2, 'triangle', 0.2, 0.01, 70); } },
  hint() { if (on()) { pluck(880, 0.35, 0, 0.25); pluck(1318.5, 0.35, 0.09, 0.4); } },
  win() { if (on()) [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => { pluck(f, 0.45, i * 0.1, 0.6); tone(f / 2, 0.4, 'triangle', 0.2, i * 0.1); }); },
  lose() { if (on()) [392, 349.23, 311.13, 261.63].forEach((f, i) => { tone(f, 0.45, 'triangle', 0.4, i * 0.22); tone(f / 2, 0.45, 'sine', 0.3, i * 0.22); }); },

// Each effect has a minimum gap between plays, and a failing sound can never break the game.
{
  const GAP = { click: 50, slide: 45, pop: 45, bump: 110, hint: 250, win: 1500, lose: 1500 }, lastAt = {};
  for (const k of Object.keys(sfx)) {
    const play = sfx[k];
    sfx[k] = (...args) => {
      const now = performance.now();
      if (now - (lastAt[k] || -1e9) < GAP[k]) return;
      lastAt[k] = now;
      try { play(...args); } catch (e) { console.error(e); }
    };
  }
}

// ---------- music: a gentle generated loop, scheduled a little ahead of the audio clock ----------
const STEP = 0.3; // seconds per eighth note
const CHORDS = [ // root, then the notes the melody may use (Hz)
  { bass: 65.41, pad: [261.63, 329.63, 392.0, 493.88], mel: [523.25, 587.33, 659.25, 783.99, 987.77, 1046.5] }, // Cmaj7
  { bass: 55.0, pad: [220.0, 261.63, 329.63, 392.0], mel: [440.0, 523.25, 659.25, 783.99, 880.0, 1046.5] },   // Am7
  { bass: 87.31, pad: [174.61, 261.63, 329.63, 440.0], mel: [523.25, 587.33, 698.46, 880.0, 1046.5, 1174.7] }, // Fmaj7
  { bass: 98.0, pad: [196.0, 246.94, 293.66, 392.0], mel: [493.88, 587.33, 659.25, 783.99, 987.77, 1174.7] },  // G6
];
const RIFFS = [ // index into the chord's melody notes; -1 is a rest
  [0, -1, 2, 3, -1, 2, 4, -1], [3, 2, -1, 0, 2, -1, 3, 4], [0, 2, 3, -1, 5, 4, 3, -1], [4, -1, 3, 2, -1, 0, -1, 2],
  [2, 3, 4, -1, 3, -1, 2, 0], [5, -1, 4, 3, 2, -1, 3, -1],
];
let nextT = 0, stepNo = 0;
function musicTick() {
  if (!AC || !save.music || AC.state !== 'running') return;
  if (nextT < AC.currentTime) { nextT = AC.currentTime + 0.06; }
  while (nextT < AC.currentTime + 0.35) {
    const bar = stepNo >> 3, i = stepNo & 7, ch = CHORDS[bar % 4], when = nextT - AC.currentTime;
    if (i === 0) {
      // soft pad under the whole bar
      for (const f of ch.pad) {
        const t = nextT, o = AC.createOscillator(), g = AC.createGain(), len = STEP * 8;
        o.type = 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 12;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 0.7); g.gain.setValueAtTime(0.045, t + len - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.5);
        o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + len + 0.6);

    if (i === 0 || i === 5) tone(ch.bass * 2, 0.7, 'sine', 0.22, when, null, musicBus);
    if (i === 0) tone(ch.bass, 1.2, 'triangle', 0.12, when, null, musicBus);
    const riff = RIFFS[(bar + (bar >> 2) * 3) % RIFFS.length], n = riff[i];
    if (n >= 0) pluck(ch.mel[n], 0.11, when, 0.55, musicBus);
    if (i % 2 === 1) noise(0.05, 0.035, 6000, 9000, when, musicBus); // light shaker on the off-beats
    nextT += STEP; stepNo++;
  }
}
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) window.addEventListener(ev, initAudio, true);
// Don't keep playing when the app is in the background.
document.addEventListener('visibilitychange', () => { if (AC) { if (document.hidden) AC.suspend(); else AC.resume().catch(() => {}); } });
document.addEventListener('click', e => { if (e.target.closest('button')) sfx.click(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

// ---------- level generation ----------
// Every level is built from its number alone, so level N is the same puzzle every time,
// and each one is checked to be solvable before it is used.
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function levelCfg(n) {
  const W = Math.min(4 + Math.floor(n / 2), 10);
  return { W, H: Math.min(Math.round(W * 1.35), 14), maxLen: Math.min(3 + Math.floor(n / 2), 9), fill: Math.min(0.55 + 0.035 * n, 0.96), tries: Math.min(1 + Math.floor(n / 2), 10) };
}
const headDir = path => { const h = path[path.length - 1], p = path[path.length - 2]; return [h.x - p.x, h.y - p.y]; };
// Walk forward from the head: is the way to the edge clear?
function ray(path, occ, W, H) {
  const h = path[path.length - 1], d = headDir(path);
  let x = h.x + d[0], y = h.y + d[1], dist = 0;
  while (x >= 0 && y >= 0 && x < W && y < H) {
    const o = occ[y * W + x];

    x += d[0]; y += d[1]; dist++;

}

  const h = path[path.length - 1], d = headDir(path);
  return path.some(p => (d[0] ? p.y === h.y && (p.x - h.x) * d[0] > 0 : p.x === h.x && (p.y - h.y) * d[1] > 0));
}

  const occ = occ0.slice(), alive = new Set();
  ns.forEach((n, i) => { if (!n.dead) alive.add(i); });
